<script>
'use strict';
const TODAY='2026-10-06', STORE='memora-demo-v1';
const money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=n=>{const d=new Date(TODAY+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const age=d=>Math.round((new Date(TODAY+'T12:00:00Z')-new Date(d+'T12:00:00Z'))/86400000);
const dateLabel=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-CA',{month:'short',day:'numeric',timeZone:'UTC'});
const stages=['New lead','Contacted','Appointment','Test drive','Negotiation','Sold'];
function seed(){
 const models=[['Toyota','RAV4','XLE',2023,32900,28700,43000,'Grey','SUV','AWD'],['Honda','CR-V','EX-L',2022,30900,26900,56000,'Black','SUV','AWD'],['BMW','X3','xDrive30i',2022,44700,39700,61000,'Black','SUV','AWD'],['Tesla','Model 3','Long Range',2022,33900,29300,67000,'White','Sedan','AWD'],['Mazda','CX-5','GS',2023,29900,26300,39000,'Red','SUV','AWD'],['Toyota','Corolla','LE',2021,22900,19400,52000,'Silver','Sedan','FWD'],['Lexus','NX','350',2023,46900,41600,31000,'Grey','SUV','AWD'],['Honda','Civic','Sport',2022,26900,23100,48000,'Blue','Sedan','FWD'],['Ford','F-150','XLT',2021,38900,34300,79000,'Grey','Truck','4WD'],['Hyundai','Tucson','Preferred',2023,28900,24800,34000,'White','SUV','AWD'],['Audi','Q5','Progressiv',2022,37900,33300,59000,'Black','SUV','AWD'],['Kia','Sportage','EX',2023,30900,26800,42000,'Blue','SUV','AWD'],['Subaru','Outback','Touring',2022,31900,27700,57000,'Green','Wagon','AWD'],['Volkswagen','Golf','GTI',2021,28900,24700,64000,'Red','Hatchback','FWD'],['Mercedes-Benz','C300','4MATIC',2021,35900,30800,68000,'Silver','Sedan','AWD'],['Toyota','Camry','SE',2022,27900,24200,49000,'Grey','Sedan','FWD'],['Chevrolet','Silverado','LT',2021,37900,32900,82000,'Black','Truck','4WD'],['Nissan','Rogue','SV',2023,27900,23900,38000,'White','SUV','AWD']];
 const vehicles=models.map((m,i)=>({id:'v'+i,stock:'A'+(173+i),make:m[0],model:m[1],trim:m[2],year:m[3],price:m[4],cost:m[5],km:m[6],color:m[7],type:m[8],drive:m[9],arrival:day(-([37,61,58,22,19,31,15,25,44,12,36,18,29,42,33,20,46,11][i])),minimum:m[4]-1400}));
 const first=['Alex Chen','Jessica Miller','Kevin Wong','Michael Brown','Sarah Patel','Daniel Park','Emily Wilson','Ryan Lee','Olivia Chen','David Singh','Chloe Martin','Jason Liu'];
 const names=['James','Sophia','Ethan','Grace','Lucas','Mia','Noah','Emma','Liam','Ava','Nathan','Zoe'];const last=['Taylor','Zhang','Khan','Thompson','Kim','Garcia'];const sources=['Facebook Marketplace','Referral','Website','Walk-in','AutoTrader'];const owners=['Jason','Priya','Daniel'];
 const customers=Array.from({length:80},(_,i)=>{let vi=[0,1,0,3,4,2,1,6,2,5,2,7][i%12];let v=vehicles[vi];let stage=stages[i<12?5:(i%5)];return {id:'c'+i,name:first[i]||names[(i-12)%12]+' '+last[Math.floor((i-12)/12)%6],email:'buyer'+(i+1)+'@example.com',phone:'416-555-'+String(100+i).padStart(4,'0'),source:sources[i%5],owner:owners[i%3],stage,vehicleId:v.id,budget:v.price+((i%3)-1)*3000,type:v.type,brand:v.make,color:i%7===0?'Not white':'Flexible',created:day(-(10+i%50)),lastContact:day(-(1+i%15)),followUp:stage==='Sold'?null:day((i%9)-4),payment:i%3===0?600:750,tradeIn:i%4===0?'2017 Honda Civic':'None',tradeValue:i%4===0?8000:null,notes:'Looking for a '+v.type+'. Prefers '+v.make+'. '+(i%3===0?'Price and monthly payment matter.':'Ready to compare available options.')};});
 Object.assign(customers[0],{stage:'Negotiation',budget:30000,lastContact:day(-12),followUp:TODAY,notes:'Test drove the grey RAV4. Price feels high. Bonus expected this month; wants monthly payment under $600.',tradeIn:'2017 Honda Civic',tradeValue:8000});
 Object.assign(customers[1],{stage:'Test drive',budget:35000,followUp:TODAY,notes:'Needs AWD SUV for two children. Previously asked about CR-V; interested after a $1,000 price reduction.'});
 Object.assign(customers[2],{stage:'Contacted',budget:34000,followUp:day(1),notes:'Previous Toyota owner. Plans to replace Corolla this month.'});
 Object.assign(customers[3],{stage:'Negotiation',followUp:day(-2),lastContact:day(-3),notes:'Financing application approved in this fictional scenario. No response for three days.'});
 const reasons=['Price','Monthly payment','Interior preference','Trade-in value','Timing'];
 const interactions=Array.from({length:160},(_,i)=>{let c=customers[i%80];let reason=reasons[i%5];return {id:'i'+i,customerId:c.id,vehicleId:c.vehicleId,date:day(-(i%28)),kind:['Phone','Test drive','Message','Walk-in'][i%4],owner:c.owner,reason,note:c.notes};});
 const sales=customers.filter(c=>c.stage==='Sold').map((c,i)=>({id:'s'+i,customerId:c.id,vehicleId:c.vehicleId,date:day(-(i*2+1)),price:vehicles.find(v=>v.id===c.vehicleId).price-(i%3)*500,owner:c.owner}));
 return {version:1,customers,vehicles,interactions,sales};
}
let db;try{db=JSON.parse(localStorage.getItem(STORE));if(!db||db.version!==1||!Array.isArray(db.customers)||!Array.isArray(db.vehicles)||!Array.isArray(db.interactions)||!Array.isArray(db.sales))db=seed()}catch{db=seed()}
let page='overview',search='',filter='All',chat=[],pending=null,selectedCustomer='c0';
const $=s=>document.querySelector(s), veh=id=>db.vehicles.find(v=>v.id===id), cust=id=>db.customers.find(c=>c.id===id), carname=v=>v.year+' '+v.make+' '+v.model;
const active=()=>db.customers.filter(c=>c.stage!=='Sold'), due=()=>active().filter(c=>c.followUp&&c.followUp<=TODAY).sort((a,b)=>a.followUp.localeCompare(b.followUp));
function persist(){try{localStorage.setItem(STORE,JSON.stringify(db));return true}catch{toast('Browser storage unavailable. Changes remain until this page closes.');return false}}
function toast(msg){$('#toast').className='toast';$('#toast').textContent=msg;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{$('#toast').className='';$('#toast').textContent=''},4500)}
function badge(stage){return '<span class="pill '+(stage==='Sold'?'green':stage==='Negotiation'?'amber':'')+'">'+esc(stage)+'</span>'}
function person(c){return '<div class="person"><span class="avatar">'+esc(c.name.split(' ').map(x=>x[0]).slice(0,2).join(''))+'</span><div><strong>'+esc(c.name)+'</strong><small>'+esc(c.source)+'</small></div></div>'}
const navs=[['overview','◈','Overview'],['customers','♙','Customers'],['inventory','▦','Inventory'],['assistant','✧','Memora assistant'],['record','⊕','Capture a memory']];
function navigate(to){page=to;search='';filter='All';render()}
function heading(title,sub,action=''){return '<div class="heading"><div><h1>'+title+'</h1><p class="sub">'+sub+'</p></div>'+action+'</div>'}
function render(){ $('#nav').innerHTML=navs.map(([id,icon,label])=>'<button data-nav="'+id+'" class="'+(page===id?'active':'')+'"><span class="navicon">'+icon+'</span>'+label+'</button>').join('');$('#breadcrumb').textContent='Workspace / '+navs.find(n=>n[0]===page)[2];$('#view').innerHTML=({overview:overview,customers:customerPage,inventory:inventoryPage,assistant:assistantPage,record:recordPage}[page])();if(page==='assistant')scrollChat(); }
function overview(){let rev=db.sales.reduce((s,x)=>s+x.price,0),profit=db.sales.reduce((s,x)=>s+x.price-veh(x.vehicleId).cost,0);let counts=stages.map(s=>db.customers.filter(c=>c.stage===s).length);let max=Math.max(...counts);return heading('Your day, connected.','Tuesday, October 6 · A clear view of your dealership.', '<button class="primary" data-nav="record">Capture a memory</button>')+'<div class="cards">'+[['Active buyers',active().length,'Across the current pipeline','♙'],['Follow-ups due',due().length,'Scheduled for today or earlier','◷'],['Sales · last 30 days',money(rev),db.sales.length+' completed deals','↗'],['Gross vehicle profit',money(profit),'Sale price minus acquisition cost','◇']].map(([l,n,t,ic])=>'<article class="card"><span class="cardicon">'+ic+'</span><div class="label">'+l+'</div><div class="number">'+n+'</div><small>'+t+'</small></article>').join('')+'</div><div class="grid"><section class="panel"><div class="panelhead"><div><h2>Sales pipeline</h2><p class="sub">Current stage of all '+db.customers.length+' buyers</p></div><span class="pill">Stage snapshot</span></div><div class="funnel">'+stages.map((s,i)=>'<div class="funnelcol"><div class="funnelvalue">'+counts[i]+'</div><div class="funnelbar" style="height:'+Math.round(35+counts[i]/max*90)+'px"></div><div class="funnellabel">'+s+'</div></div>').join('')+'</div></section><section class="panel"><div class="panelhead"><h2>From your company’s memory</h2><span class="pill">Insights</span></div><div class="insight"><h3>'+due().length+' conversations need a next step</h3><p>Review buyers whose scheduled follow-up is due.</p><button class="linkbutton" data-query="我今天应该联系谁？">Review follow-ups</button></div><div class="insight"><h3>BMW X3 · '+age(veh('v2').arrival)+' days in stock</h3><p>'+db.interactions.filter(i=>i.vehicleId==='v2').length+' recorded conversations. Explore recorded objections.</p><button class="linkbutton" data-query="BMW X3 为什么卖不掉？">Explore the X3</button></div></section><section class="panel"><div class="panelhead"><h2>Follow-up shortlist</h2><button class="linkbutton" data-nav="customers">All customers</button></div>'+customerTable(due().slice(0,5),true)+'</section><section class="panel"><div class="panelhead"><h2>What buyers are asking about</h2><span class="sub">Last 30 days</span></div>'+barChart(modelCounts(),'count')+'<button class="linkbutton" data-query="最近一个月客户最常问什么车？">Ask Memora about demand</button></section></div>'}
function customerTable(rows,compact=false){return '<div class="tablewrap"><table><thead><tr><th>Customer</th><th>Stage</th><th>Interest</th>'+(compact?'':'<th>Budget</th><th>Owner</th>')+'<th>Follow-up</th></tr></thead><tbody>'+rows.map(c=>'<tr class="rowclick" data-customer="'+c.id+'"><td>'+person(c)+'</td><td>'+badge(c.stage)+'</td><td>'+esc(veh(c.vehicleId).model)+'</td>'+(compact?'':'<td>'+money(c.budget)+'</td><td>'+esc(c.owner)+'</td>')+'<td>'+(c.followUp?'<span class="'+(c.followUp<TODAY?'pill red':'')+'">'+dateLabel(c.followUp)+'</span>':'—')+'</td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">No matching customers.</div>')+'</div>'}
function customerPage(){let rows=db.customers.filter(c=>(filter==='All'||c.stage===filter||(filter==='Due today'&&c.followUp&&c.followUp<=TODAY&&c.stage!=='Sold'))&&(c.name+' '+c.source+' '+veh(c.vehicleId).model).toLowerCase().includes(search.toLowerCase()));return heading('Customers','Preferences, conversations and next steps — all in one place.','<button class="primary" data-nav="record">Add a conversation</button>')+'<div class="filters"><input class="search" id="search" aria-label="Search customers" placeholder="Search name, source or vehicle…" value="'+esc(search)+'"><select id="filter" aria-label="Filter by stage">'+['All','Due today',...stages].map(s=>'<option '+(filter===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><section class="panel"><div class="panelhead"><h2>'+rows.length+' customers</h2><span class="sub">Click a customer to open their memory</span></div>'+customerTable(rows)+'</section>'}
function inventoryPage(){let rows=db.vehicles.filter(v=>(filter==='All'||(filter==='30+ days'?age(v.arrival)>=30:v.type===filter))&&(carname(v)+' '+v.stock).toLowerCase().includes(search.toLowerCase()));return heading('Inventory','Connect the cars on your lot with the people in your pipeline.')+'<div class="filters"><input id="search" class="search" aria-label="Search inventory" placeholder="Search model or stock number…" value="'+esc(search)+'"><select id="filter" aria-label="Filter inventory">'+['All','SUV','Sedan','Truck','Wagon','Hatchback','30+ days'].map(s=>'<option '+(filter===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="inventory">'+rows.map(v=>'<article class="vehiclecard"><div class="stock">STOCK #'+v.stock+' <span style="float:right" class="pill '+(age(v.arrival)>45?'amber':'')+'">'+age(v.arrival)+' days</span></div><span class="eyebrow">'+v.type+' · '+v.drive+'</span><div class="vehicletitle">'+esc(carname(v))+'</div><div class="sub">'+esc(v.trim)+' · '+esc(v.color)+'</div><div class="vehicleprice">'+money(v.price)+'</div><div class="vehiclefacts"><span>'+v.km.toLocaleString()+' km</span><span>Cost '+money(v.cost)+'</span></div><div class="vehiclefoot"><span>'+active().filter(c=>c.vehicleId===v.id).length+' interested buyers</span><button class="linkbutton" data-match="'+v.id+'">Find matches</button></div></article>').join('')+'</div>'+(rows.length?'':'<div class="empty">No matching vehicles.</div>')}
function modelCounts(){let counts={};db.interactions.filter(i=>age(i.date)>=0&&age(i.date)<30).forEach(i=>{let n=veh(i.vehicleId).model;counts[n]=(counts[n]||0)+1});return Object.entries(counts).sort((a,b)=>b[1]-a[1])}
function barChart(entries,mode='percent'){let total=entries.reduce((s,e)=>s+e[1],0),max=Math.max(1,...entries.map(e=>e[1]));return '<div class="bars">'+entries.map(([label,n])=>'<div class="barrow"><span>'+esc(label)+'</span><div class="bartrack"><div class="barfill" style="width:'+Math.round(n/max*100)+'%"></div></div><strong>'+(mode==='percent'?(total?n/total*100:0).toFixed(1)+'%':n)+'</strong></div>').join('')+'</div><p class="sub">'+total+' '+(mode==='money'?'CAD':'records')+' in this view. '+(mode==='percent'?'Share of recorded conversations.':'')+'</p>'}
const suggestions=['我今天应该联系谁？','最近一个月客户最常问什么车？','BMW X3 为什么卖不掉？','RAV4 有哪些潜在客户？','最近一个月销售收入，按销售员出图'];
function assistantPage(){return heading('Ask your company’s memory.','Memora connects buyers, vehicles and the conversations between them.')+'<div class="chatlayout"><section class="chatpanel"><div class="chathead"><span class="assistantmark">M</span><div><h3>Memora</h3><div class="sub">'+db.customers.length+' buyers · '+db.vehicles.length+' vehicles · '+db.interactions.length+' memories</div></div><span class="pill" style="margin-left:auto">Demo mode</span></div><div class="messages" id="messages">'+(chat.length?chat.map(m=>'<div class="message '+m.role+'"><div class="bubble">'+m.html+'</div></div>').join(''):'<div class="message assistant"><div class="bubble"><h2 style="margin:12px 0">What would you like to know?</h2><p class="sub">试试下面的问题，答案和图表都来自这份演示数据。</p><div class="querybuttons">'+suggestions.map(q=>'<button data-query="'+esc(q)+'">'+q+'</button>').join('')+'</div></div></div>')+'</div><form class="composer" id="askform"><input aria-label="Ask Memora" id="question" placeholder="Ask in English or Chinese…" required autocomplete="off"><button class="primary" type="submit">Ask</button></form></section><aside class="panel chathelp"><span class="eyebrow">Connected memory</span><h3>Sales & customers</h3><p>Follow-ups, preferences, budgets and salesperson ownership.</p><h3>Inventory</h3><p>Stock age, acquisition cost, list price and buyer matching.</p><h3>Recorded conversations</h3><p>Demand and objection charts computed from stored demo records.</p><h3>Try the full loop</h3><p>Capture a conversation, confirm the extracted fields, then ask about that buyer again.</p><div class="notice">此版使用规则查询与字段提取，尚未接入真实 AI。不会查询市场价格，也不会发送消息。</div><button class="outline" id="clearchat">Clear conversation</button></aside></div>'}
function source(text){return '<div class="source">来源：'+esc(text)+' · 演示日期 '+TODAY+'</div>'}
function matching(v){return active().filter(c=>c.type===v.type&&c.brand===v.make).map(c=>({c,gap:v.price-c.budget,score:(c.vehicleId===v.id?4:0)+(c.budget>=v.price?3:0)+(c.stage==='Negotiation'?2:0)})).sort((a,b)=>b.score-a.score)}
function listBuyers(rows){return '<ol class="replylist">'+rows.slice(0,6).map(c=>'<li><button class="linkbutton" data-customer="'+c.id+'">'+esc(c.name)+'</button> '+badge(c.stage)+'<small>'+esc(c.notes)+'</small><small>预算 '+money(c.budget)+' · '+esc(veh(c.vehicleId).model)+' · '+esc(c.owner)+'</small></li>').join('')+'</ol>'}
function answer(q){let lower=q.toLowerCase(),v=db.vehicles.find(v=>lower.includes(v.model.toLowerCase())),c=db.customers.find(c=>lower.includes(c.name.toLowerCase())||lower.includes(c.name.split(' ')[0].toLowerCase()));
 if(/收入|销售额|revenue|profit|利润/.test(lower)){let profit=/profit|利润/.test(lower),by={};db.sales.filter(s=>age(s.date)>=0&&age(s.date)<30).forEach(s=>by[s.owner]=(by[s.owner]||0)+s.price-(profit?veh(s.vehicleId).cost:0));return '<p>最近 30 天'+(profit?'车辆毛利润':'成交收入')+'为 <strong>'+money(Object.values(by).reduce((a,b)=>a+b,0))+'</strong>，共 '+db.sales.length+' 笔成交。</p>'+barChart(Object.entries(by),'money')+'<p class="sub">图中数值单位为 CAD。'+(profit?'毛利润只扣除车辆购入成本，未计整备、工资和其他费用。':'按成交销售员汇总。')+'</p>'+source('sales 成交金额、日期、owner'+(profit?'；vehicles.cost':''));}
 if(/最常|热门|需求|most|popular|demand/.test(lower)){return '<p>最近 30 天，<strong>'+esc(modelCounts()[0][0])+'</strong> 的沟通记录最多。以下为全部车型占比：</p>'+barChart(modelCounts())+'<p class="sub">这是沟通次数，重复客户的多次沟通会分别计数。</p>'+source('interactions → vehicleId → vehicles.model，最近 30 天');}
 if(v&&/为什么|卖不掉|why|objection|滞销/.test(lower)){let ints=db.interactions.filter(i=>i.vehicleId===v.id),counts={};ints.forEach(i=>counts[i.reason]=(counts[i.reason]||0)+1);let fits=matching(v);return '<p><strong>'+esc(carname(v))+'</strong> 在库 '+age(v.arrival)+' 天。共有 '+ints.length+' 条沟通记录，涉及 '+new Set(ints.map(i=>i.customerId)).size+' 位客户。记录的主要顾虑如下：</p>'+barChart(Object.entries(counts))+'<p>挂牌价 '+money(v.price)+'。可先回访 '+fits.filter(x=>x.gap<=0).length+' 位预算覆盖挂牌价的匹配客户。建议先确认他们的需求是否仍然有效。</p>'+listBuyers(fits.slice(0,3).map(x=>x.c))+'<p class="sub">没有外部市场行情；这些顾虑不能单独证明滞销原因，也不构成市场估价。</p>'+source('vehicles.arrival；interactions.reason；customers.budget 与车型偏好');}
 if(v){let fits=matching(v);return '<p><strong>'+esc(carname(v))+'</strong> · '+money(v.price)+'。共有 '+fits.length+' 位活跃客户符合品牌和车身类型偏好：</p>'+listBuyers(fits.map(x=>x.c))+'<p class="sub">展示前 6 位。预算低于挂牌价的客户仍列出，供销售判断；没有预测成交概率。</p>'+source('customers：品牌、车型类型、预算、兴趣车辆与当前阶段');}
 if(c){return '<p><strong>'+esc(c.name)+'</strong> · '+badge(c.stage)+'</p><p>'+esc(c.notes)+'</p><p>关注 '+esc(carname(veh(c.vehicleId)))+'；预算 '+money(c.budget)+'；月供目标 '+money(c.payment)+'。'+(c.followUp?'下次跟进 '+dateLabel(c.followUp)+'。':'当前无跟进日期。')+'</p><button class="outline" data-customer="'+c.id+'">Open customer memory</button>'+source('customers.'+c.id+' 与关联车辆、沟通记录');}
 if(/联系|跟进|follow|today|今天/.test(lower)){let rows=due();return '<p>今天有 <strong>'+rows.length+' 位客户</strong>需要跟进，按最早到期排序。先看这 '+Math.min(6,rows.length)+' 位：</p>'+listBuyers(rows)+source('customers.followUp ≤ '+TODAY+'，排除 Sold');}
 return '<p>演示版暂时无法理解这个问题。你可以查询客户姓名、车型匹配、今天的跟进名单、热门车型、收入或利润。</p><div class="querybuttons">'+suggestions.slice(0,3).map(x=>'<button data-query="'+esc(x)+'">'+x+'</button>').join('')+'</div>'+source('未执行查询；此版本使用有限规则，不是大模型');
}
function ask(q){q=q.trim();if(!q)return;chat.push({role:'user',html:esc(q)});chat.push({role:'assistant',html:answer(q)});page='assistant';render()}
function scrollChat(){requestAnimationFrame(()=>{const el=$('#messages');if(el)el.scrollTop=el.scrollHeight})}
const example='Alex 今天看了灰色 RAV4，觉得 $32,900 太贵，希望月供控制在 $600 以内。旧车是 2017 Honda Civic，trade-in 估值 $8,000，下周再联系。';
function recordPage(){return heading('Capture a memory.','Say it naturally. Review the fields before adding it to the customer’s history.')+'<div class="notice">演示录入仅保存在当前浏览器。字段由有限规则提取，请检查后保存；语音可用性取决于浏览器。</div><div class="notegrid"><section class="panel"><form id="recordform"><div class="field"><label for="recordcustomer">Customer</label><select id="recordcustomer">'+db.customers.map(c=>'<option value="'+c.id+'" '+(selectedCustomer===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label for="recordtext">What happened?</label><textarea id="recordtext" placeholder="Example: Alex test drove the RAV4, but wants payments under $600. Follow up next week.">'+(pending?esc(pending.raw):'')+'</textarea></div><div class="recordactions"><button type="submit" class="primary">Extract & review</button><button type="button" class="outline" id="voice">Voice input</button><button type="button" class="linkbutton" id="example">Use example</button></div></form>'+(pending?extractionView():'')+'</section><aside class="panel"><h2>One conversation, connected.</h2><div class="timeline"><div class="timelineitem"><small>1 · CAPTURE</small><p>Record a call, visit or message in your own words.</p></div><div class="timelineitem"><small>2 · REVIEW</small><p>Check the customer, vehicle, payment target and follow-up date.</p></div><div class="timelineitem"><small>3 · SAVE</small><p>Add the original note and update the reviewed fields.</p></div><div class="timelineitem"><small>4 · ASK</small><p>Memora’s next query uses the updated memory.</p></div></div><h3>Recent memories</h3>'+db.interactions.slice(-3).reverse().map(i=>'<div class="insight"><p><strong>'+esc(cust(i.customerId).name)+'</strong> · '+dateLabel(i.date)+'</p><p>'+esc(i.note.slice(0,115))+'</p></div>').join('')+'</aside></div>'}
function extract(raw,id){let lower=raw.toLowerCase(),c=cust(id),v=db.vehicles.find(v=>lower.includes(v.model.toLowerCase()));let pay=raw.match(/(?:月供|payment[s]?|monthly)[^\d]{0,25}\$?([\d,]+)/i);let follow=/下周|next week/i.test(raw)?day(7):/明天|tomorrow/i.test(raw)?day(1):null;let explicit=raw.match(/\b(2026-\d{2}-\d{2})\b/);if(explicit&&!Number.isNaN(Date.parse(explicit[1])))follow=explicit[1];let trade=raw.match(/(?:trade[- ]?in|估值)[^\d]{0,15}\$?([\d,]+)/i);let reason=/贵|价格|price|expensive/i.test(raw)?'Price':pay?'Monthly payment':'Timing';return {customerId:id,raw,vehicleId:v?.id||c.vehicleId,payment:pay?Number(pay[1].replaceAll(',','')):null,followUp:follow,tradeValue:trade?Number(trade[1].replaceAll(',','')):null,stage:/试驾|test drove|test drive/i.test(raw)?'Test drive':c.stage,reason};}
function extractionView(){let p=pending;return '<div class="extraction"><h3>Review extracted fields</h3><p class="sub">Unmentioned values keep their existing value.</p><dl class="kv"><dt>Customer</dt><dd>'+esc(cust(p.customerId).name)+'</dd><dt>Original note</dt><dd>'+esc(p.raw)+'</dd></dl><div class="field"><label for="reviewvehicle">Interested vehicle</label><select id="reviewvehicle">'+db.vehicles.map(v=>'<option value="'+v.id+'" '+(p.vehicleId===v.id?'selected':'')+'>'+esc(carname(v))+'</option>').join('')+'</select></div><div class="field"><label for="reviewpayment">Monthly payment target · CAD</label><input type="number" min="1" id="reviewpayment" value="'+(p.payment??'')+'" placeholder="Keep current value"></div><div class="field"><label for="reviewtrade">Trade-in estimate · CAD</label><input type="number" min="0" id="reviewtrade" value="'+(p.tradeValue??'')+'" placeholder="Keep current value"></div><div class="field"><label for="reviewdate">Next follow-up</label><input type="date" id="reviewdate" value="'+(p.followUp??'')+'"></div><div class="field"><label for="reviewstage">Sales stage</label><select id="reviewstage">'+stages.filter(s=>s!=='Sold'||p.stage==='Sold').map(s=>'<option '+(s===p.stage?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="field"><label for="reviewreason">Recorded objection</label><select id="reviewreason">'+['Price','Monthly payment','Interior preference','Trade-in value','Timing'].map(s=>'<option '+(s===p.reason?'selected':'')+'>'+s+'</option>').join('')+'</select></div><button class="primary" id="savememory">Confirm & save memory</button></div>'}
function saveMemory(){if(!pending)return;let c=cust(pending.customerId);for(const id of ['reviewpayment','reviewtrade','reviewdate'])if(!$('#'+id).reportValidity())return;let raw=pending.raw;Object.assign(c,{vehicleId:$('#reviewvehicle').value,stage:$('#reviewstage').value,notes:raw,lastContact:TODAY});let v=veh(c.vehicleId);c.type=v.type;c.brand=v.make;if($('#reviewpayment').value)c.payment=Number($('#reviewpayment').value);if($('#reviewtrade').value)c.tradeValue=Number($('#reviewtrade').value);if($('#reviewdate').value)c.followUp=$('#reviewdate').value;if(c.stage==='Sold')c.followUp=null;db.interactions.push({id:'i'+Date.now(),customerId:c.id,vehicleId:c.vehicleId,date:TODAY,kind:'Sales note',owner:c.owner,reason:$('#reviewreason').value,note:raw});let durable=persist();pending=null;render();toast('Memory saved for '+c.name+(durable?' in this browser.':' for this session.'));}
function openCustomer(id){const c=cust(id);if(!c)return;const v=veh(c.vehicleId),history=db.interactions.filter(i=>i.customerId===c.id).sort((a,b)=>b.date.localeCompare(a.date));$('#detailbody').innerHTML='<div class="dialogtitle"><div><h2>'+esc(c.name)+'</h2><p class="sub">'+esc(c.owner)+' · '+esc(c.source)+'</p></div><button class="dialogclose" id="closedetail" aria-label="Close customer details">×</button></div>'+badge(c.stage)+'<div class="detailstats"><div><small>Budget</small><strong>'+money(c.budget)+'</strong></div><div><small>Monthly target</small><strong>'+money(c.payment)+'</strong></div><div><small>Next follow-up</small><strong>'+(c.followUp?dateLabel(c.followUp):'None')+'</strong></div></div><dl class="kv"><dt>Contact</dt><dd>'+esc(c.email)+'<br>'+esc(c.phone)+'</dd><dt>Interested in</dt><dd>'+esc(carname(v))+' · '+money(v.price)+'</dd><dt>Preferences</dt><dd>'+esc(c.type)+' · '+esc(c.brand)+' · '+esc(c.color)+'</dd><dt>Trade-in</dt><dd>'+esc(c.tradeIn)+(c.tradeValue!==null?' · '+money(c.tradeValue)+' estimate':'')+'</dd></dl><h3 style="margin-top:24px">Latest memory</h3><p>'+esc(c.notes)+'</p><div class="recordactions"><button class="primary" data-recordcustomer="'+c.id+'">Add a memory</button><button class="outline" data-customerask="'+c.id+'">Ask Memora</button><button class="outline" data-follow="'+c.id+'">Set follow-up tomorrow</button></div><h3 style="margin-top:28px">Conversation history · '+history.length+'</h3><div class="timeline">'+history.map(i=>'<div class="timelineitem"><small>'+dateLabel(i.date)+' · '+esc(i.kind)+' · '+esc(i.owner)+'</small><p>'+esc(i.note)+'</p><span class="pill">'+esc(i.reason)+'</span></div>').join('')+'</div>';if(!$('#detail').open)$('#detail').showModal()}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-customer]');if(!b)return;if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.query){ask(b.dataset.query);return}if(b.dataset.customer){openCustomer(b.dataset.customer);return}if(b.dataset.match){ask(carname(veh(b.dataset.match))+' 有哪些潜在客户？');return}if(b.dataset.recordcustomer){selectedCustomer=b.dataset.recordcustomer;pending=null;$('#detail').close();navigate('record');return}if(b.dataset.customerask){$('#detail').close();ask(cust(b.dataset.customerask).name+' 的情况怎么样？');return}if(b.dataset.follow){let c=cust(b.dataset.follow);if(c.stage==='Sold'){toast('This customer is marked Sold.');return}c.followUp=day(1);persist();render();openCustomer(c.id);toast('Follow-up scheduled for '+dateLabel(day(1)));return}if(b.id==='closedetail')$('#detail').close();if(b.id==='clearchat'){chat=[];render()}if(b.id==='example')$('#recordtext').value=example;if(b.id==='savememory')saveMemory();if(b.id==='voice')voice();if(b.id==='reset'){$('#detailbody').innerHTML='<div class="dialogtitle"><h2>Reset this demo?</h2><button class="dialogclose" id="closedetail" aria-label="Close">×</button></div><p>This removes the changes saved in this browser and restores the fictional dataset.</p><button class="primary" id="confirmreset">Reset demo</button>';$('#detail').showModal()}if(b.id==='confirmreset'){db=seed();persist();pending=null;chat=[];$('#detail').close();navigate('overview');toast('Demo reset.')}});
document.addEventListener('submit',e=>{if(e.target.id==='askform'){e.preventDefault();ask($('#question').value)}if(e.target.id==='recordform'){e.preventDefault();let raw=$('#recordtext').value.trim();if(!raw){toast('Add a conversation first.');return}selectedCustomer=$('#recordcustomer').value;pending=extract(raw,selectedCustomer);render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.id==='recordcustomer'){selectedCustomer=e.target.value;pending=null;$('.extraction')?.remove()}});
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Voice input is unavailable here. Please type or paste your note.');return}const rec=new SR();rec.lang='zh-CN';rec.interimResults=false;rec.onresult=e=>{if($('#recordtext'))$('#recordtext').value+=e.results[0][0].transcript};rec.onerror=()=>toast('Could not capture audio. Check microphone access or type your note.');rec.onend=()=>{if($('#voice'))$('#voice').textContent='Voice input'};try{rec.start();$('#voice').textContent='Listening…'}catch{toast('Microphone could not start. Please type your note.')}}
if(document.modelContext?.registerTool){const lifecycle=new AbortController();for(const tool of [{name:'query_dealership_memory',description:'Read fictional dealership records using the same demo assistant as the interface. Opens the assistant and displays the answer.',inputSchema:{type:'object',properties:{question:{type:'string'}},required:['question'],additionalProperties:false},annotations:{readOnlyHint:true},execute(input){if(!input||typeof input.question!=='string'||!input.question.trim())throw new Error('question must be a nonempty string');ask(input.question);return {question:input.question,answer:chat.at(-1).html.replace(/<[^>]*>/g,' ')}}},{name:'open_customer_memory',description:'Open an existing customer detail panel without modifying records.',inputSchema:{type:'object',properties:{customerId:{type:'string'}},required:['customerId'],additionalProperties:false},annotations:{readOnlyHint:true},execute(input){if(!input||typeof input.customerId!=='string'||!cust(input.customerId))throw new Error('Unknown customer');openCustomer(input.customerId);return {customerId:input.customerId,name:cust(input.customerId).name}}}]){try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{})}catch{}}window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true})}
render();
</script></body></html>
