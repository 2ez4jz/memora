function answer(q){let lower=q.toLowerCase(),v=db.vehicles.find(v=>lower.includes(v.model.toLowerCase())),c=db.customers.find(c=>lower.includes(c.name.toLowerCase())||lower.includes(c.name.split(' ')[0].toLowerCase()));
 if(/收入|销售额|revenue|profit|利润/.test(lower)){let profit=/profit|利润/.test(lower),by={};db.sales.filter(s=>age(s.date)>=0&&age(s.date)<30).forEach(s=>by[s.owner]=(by[s.owner]||0)+s.price-(profit?veh(s.vehicleId).cost:0));return '<p>最近 30 天'+(profit?'车辆毛利润':'成交收入')+'为 <strong>'+money(Object.values(by).reduce((a,b)=>a+b,0))+'</strong>，共 '+db.sales.length+' 笔成交。</p>'+barChart(Object.entries(by),'money')+'<p class="sub">图中数值单位为加元。'+(profit?'毛利润只扣除车辆购入成本，未计整备、工资和其他费用。':'按成交销售员汇总。')+'</p>'+source('成交记录中的金额、日期、负责销售'+(profit?'；车辆购入成本':''));}

 if(v&&/为什么|卖不掉|why|objection|滞销/.test(lower)){let ints=db.interactions.filter(i=>i.vehicleId===v.id),counts={};ints.forEach(i=>counts[i.reason]=(counts[i.reason]||0)+1);let fits=matching(v);return '<p><strong>'+esc(carname(v))+'</strong> 在库 '+age(v.arrival)+' 天。共有 '+ints.length+' 条沟通记录，涉及 '+new Set(ints.map(i=>i.customerId)).size+' 位客户。记录的主要顾虑如下：</p>'+barChart(Object.entries(counts))+'<p>挂牌价 '+money(v.price)+'。可先回访 '+fits.filter(x=>x.gap<=0).length+' 位预算覆盖挂牌价的匹配客户。建议先确认他们的需求是否仍然有效。</p>'+listBuyers(fits.slice(0,3).map(x=>x.c))+'<p class="sub">没有外部市场行情；这些顾虑不能单独证明滞销原因，也不构成市场估价。</p>'+source('车辆入库日期、沟通中的顾虑、客户预算与车型偏好');}
 if(v){let fits=matching(v);return '<p><strong>'+esc(carname(v))+'</strong> · '+money(v.price)+'。共有 '+fits.length+' 位活跃客户符合品牌和车身类型偏好：</p>'+listBuyers(fits.map(x=>x.c))+'<p class="sub">展示前 6 位。预算低于挂牌价的客户仍列出，供销售判断；没有预测成交概率。</p>'+source('客户的品牌偏好、车身类型、预算、意向车辆与销售阶段');}
 if(c){return '<p><strong>'+esc(c.name)+'</strong> · '+badge(c.stage)+'</p><p>'+esc(noteText(c.notes))+'</p><p>关注 '+esc(carname(veh(c.vehicleId)))+'；预算 '+money(c.budget)+'；月供目标 '+money(c.payment)+'。'+(c.followUp?'下次跟进 '+dateLabel(c.followUp)+'。':'当前无跟进日期。')+'</p><button class="outline" data-customer="'+c.id+'">查看客户档案</button>'+source('客户档案 '+c.id+' 及关联车辆、沟通记录');}

function snapshot(){return {...db,customers:db.customers.map(c=>({...c,notes:noteText(c.notes)})),interactions:db.interactions.map(i=>({...i,note:noteText(i.note)}))};}
async function apiPost(path,body){let response;try{response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(180000)});}catch{throw new Error('网络连接失败或请求超时，请重试。')}let result;try{result=await response.json()}catch{throw new Error('服务响应无效，请刷新后重试。')}if(!response.ok)throw new Error(result.error||'请求失败，请重试。');return result;}
function formatReply(text){return esc(text).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').split(/\n\s*\n/).map(p=>'<p>'+p.replaceAll('\n','<br>')+'</p>').join('');}
function aiChart(chart){if(!chart?.data?.length)return '';const data=chart.data.filter(d=>typeof d.label==='string'&&Number.isFinite(d.value));if(!data.length)return '';const sum=data.reduce((s,d)=>s+d.value,0),max=Math.max(1,...data.map(d=>d.value)),unit=chart.unit==='CAD'?'加元':chart.unit||'',val=n=>chart.unit==='CAD'?money(n):n.toLocaleString('zh-CN',{maximumFractionDigits:2});const palette=['#2654ed','#6c89f5','#25a887','#f4af45','#8b6bd6','#e47485','#4388ae','#798399'];let pie='';if(chart.type==='pie'&&chart.metric!=='average'&&data.every(d=>d.value>=0)&&sum>0){const denominator=chart.total||sum;let pos=0;const stops=data.map((d,i)=>{const start=pos;pos+=d.value/denominator*100;return palette[i%palette.length]+' '+start+'% '+pos+'%'});if(pos<99.99)stops.push('#dbe1ec '+pos+'% 100%');pie='<div class="piechart" role="img" aria-label="'+esc(data.map(d=>label(d.label)+' '+val(d.value)).join('；'))+'" style="background:conic-gradient('+stops.join(',')+')"><div>'+esc(unit)+'<strong>'+val(denominator)+'</strong></div></div>';}
return '<section class="aichart"><h3>'+esc(label(chart.groupBy||chart.title))+' · '+(chart.metric==='count'?'数量':chart.metric==='average'?'平均值':'合计')+'</h3>'+pie+'<div class="bars">'+data.map((d,i)=>'<div class="barrow"><span>'+esc(label(d.label))+'</span><div class="bartrack"><div class="barfill" style="width:'+Math.max(0,d.value/max*100)+'%;background:'+palette[i%palette.length]+'"></div></div><strong>'+val(d.value)+(pie?' <small>'+((d.value/(chart.total||sum))*100).toFixed(1)+'%</small>':'')+'</strong></div>').join('')+'</div>'+(chart.partial?'<p class="sub">仅展示部分分组。</p>':'')+'</section>';}
async function ask(q){q=q.trim();if(!q||chatBusy)return;const history=chat.filter(m=>m.text).slice(-6).map(m=>({role:m.role,text:m.text}));chat.push({role:'user',html:esc(q),text:q});page='assistant';if(!aiStatus.configured){chat.push({role:'assistant',html:answer(q)+'<div class="source">离线演示回答 · 尚未配置 OpenAI API 密钥</div>'});render();return;}chatBusy=true;render();try{const r=await apiPost('/api/chat',{question:q,history,data:snapshot()});chat.push({role:'assistant',text:r.answer,html:formatReply(r.answer)+aiChart(r.chart)+(r.customerIds?.length?'<div class="querybuttons">'+r.customerIds.filter(id=>cust(id)).map(id=>'<button data-customer="'+esc(id)+'">'+esc(cust(id).name)+'</button>').join('')+'</div>':'')+source(r.sourceNote)+'<div class="source">OpenAI · '+esc(r.model)+' · 本次用量 '+(r.usage?.input_tokens||0)+' 输入 / '+(r.usage?.output_tokens||0)+' 输出 token</div>'});}catch(e){chat.push({role:'assistant',html:'<p>'+esc(e.message)+'</p><div class="querybuttons"><button data-query="'+esc(q)+'">重试这个问题</button></div>'+source('OpenAI 调用失败，未生成答案')});}finally{chatBusy=false;if(page==='assistant')render();}}
async function captureMemory(raw,id){if(extractBusy)return;selectedCustomer=id;recordDraft=raw;pending=null;if(!aiStatus.configured){pending=extract(raw,id);render();return}extractBusy=true;render();try{const result=await apiPost('/api/extract',{raw,customerId:id,data:snapshot()});if(selectedCustomer===id&&recordDraft===raw)pending=result;else toast('输入已变化，请重新提取最新内容。');}catch(e){toast(e.message)}finally{extractBusy=false;if(page==='record')render();}}
async function checkAI(){try{const r=await fetch('/api/status',{cache:'no-store'});const result=await r.json();aiStatus={configured:r.ok&&result.configured===true,checked:true,model:result.model||''};}catch{aiStatus={configured:false,checked:true,model:''};}if(page==='assistant'||page==='record')render();}

function scrollChat(){requestAnimationFrame(()=>{const el=$('#messages');if(el)el.scrollTop=el.scrollHeight})}
const example='Alex 今天看了灰色 RAV4，觉得 $32,900 太贵，希望月供控制在 $600 以内。旧车是 2017 Honda Civic，旧车置换估值 $8,000，下周再联系。';
function recordPage(){return heading('记录一次沟通。','用自己的话记录，检查提取结果后存入客户档案。')+'<div class="notice">演示录入仅保存在当前浏览器。'+(aiStatus.configured?'字段由 OpenAI 提取':'尚未配密钥，字段由离线规则提取')+'，请检查后保存；语音可用性取决于浏览器。</div><div class="notegrid"><section class="panel"><form id="recordform"><div class="field"><label for="recordcustomer">客户</label><select id="recordcustomer">'+db.customers.map(c=>'<option value="'+c.id+'" '+(selectedCustomer===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label for="recordtext">这次聊了什么？</label><textarea id="recordtext" placeholder="例如：Alex 今天试驾了 RAV4，希望月供低于 $600，下周联系。">'+esc(pending?pending.raw:recordDraft)+'</textarea></div><div class="recordactions"><button type="submit" class="primary" '+(extractBusy?'disabled':'')+'>'+(extractBusy?'AI 正在提取…':'提取并检查')+'</button><button type="button" class="outline" id="voice">语音输入</button><button type="button" class="linkbutton" id="example">填入示例</button></div></form>'+(pending?extractionView():'')+'</section><aside class="panel"><h2>一次沟通，留下完整记忆。</h2><div class="timeline"><div class="timelineitem"><small>1 · 记录</small><p>用自己的话记录电话、到店或消息沟通。</p></div><div class="timelineitem"><small>2 · 检查</small><p>检查客户、意向车辆、月供目标和跟进日期。</p></div><div class="timelineitem"><small>3 · 保存</small><p>保存原始记录，并更新已确认的字段。</p></div><div class="timelineitem"><small>4 · 查询</small><p>Memora 下次查询会使用更新后的信息。</p></div></div><h3>最近的沟通记录</h3>'+db.interactions.slice(-3).reverse().map(i=>'<div class="insight"><p><strong>'+esc(cust(i.customerId).name)+'</strong> · '+dateLabel(i.date)+'</p><p>'+esc(noteText(i.note).slice(0,115))+'</p></div>').join('')+'</aside></div>'}
function extract(raw,id){let lower=raw.toLowerCase(),c=cust(id),v=db.vehicles.find(v=>lower.includes(v.model.toLowerCase()));let pay=raw.match(/(?:月供|payment[s]?|monthly)[^\d]{0,25}\$?([\d,]+)/i);let follow=/下周|next week/i.test(raw)?day(7):/明天|tomorrow/i.test(raw)?day(1):null;let explicit=raw.match(/\b(2026-\d{2}-\d{2})\b/);if(explicit&&!Number.isNaN(Date.parse(explicit[1])))follow=explicit[1];let trade=raw.match(/(?:trade[- ]?in|估值)[^\d]{0,15}\$?([\d,]+)/i);let reason=/贵|价格|price|expensive/i.test(raw)?'Price':pay?'Monthly payment':'Timing';return {customerId:id,raw,vehicleId:v?.id||c.vehicleId,payment:pay?Number(pay[1].replaceAll(',','')):null,followUp:follow,tradeValue:trade?Number(trade[1].replaceAll(',','')):null,stage:/试驾|test drove|test drive/i.test(raw)?'Test drive':c.stage,reason};}
function extractionView(){let p=pending;return '<div class="extraction"><h3>检查提取结果</h3><p class="sub">未提及的字段会保留原有内容。</p><dl class="kv"><dt>客户</dt><dd>'+esc(cust(p.customerId).name)+'</dd><dt>原始记录</dt><dd>'+esc(p.raw)+'</dd></dl><div class="field"><label for="reviewvehicle">意向车辆</label><select id="reviewvehicle">'+db.vehicles.map(v=>'<option value="'+v.id+'" '+(p.vehicleId===v.id?'selected':'')+'>'+esc(carname(v))+'</option>').join('')+'</select></div><div class="field"><label for="reviewpayment">月供目标 · 加元</label><input type="number" min="1" id="reviewpayment" value="'+(p.payment??'')+'" placeholder="保留原有内容"></div><div class="field"><label for="reviewtrade">旧车置换估值 · 加元</label><input type="number" min="0" id="reviewtrade" value="'+(p.tradeValue??'')+'" placeholder="保留原有内容"></div><div class="field"><label for="reviewdate">下次跟进</label><input type="date" id="reviewdate" value="'+(p.followUp??'')+'"></div><div class="field"><label for="reviewstage">销售阶段</label><select id="reviewstage">'+stages.filter(s=>s!=='Sold'||p.stage==='Sold').map(s=>'<option value="'+esc(s)+'" '+(s===p.stage?'selected':'')+'>'+label(s)+'</option>').join('')+'</select></div><div class="field"><label for="reviewreason">客户顾虑</label><select id="reviewreason">'+['Price','Monthly payment','Interior preference','Trade-in value','Timing','Not recorded'].map(s=>'<option value="'+esc(s)+'" '+(s===p.reason?'selected':'')+'>'+label(s)+'</option>').join('')+'</select></div><button class="primary" id="savememory">确认并保存</button></div>'}
function saveMemory(){if(!pending)return;let c=cust(pending.customerId);for(const id of ['reviewpayment','reviewtrade','reviewdate'])if(!$('#'+id).reportValidity())return;let raw=pending.raw;Object.assign(c,{vehicleId:$('#reviewvehicle').value,stage:$('#reviewstage').value,notes:raw,lastContact:TODAY});let v=veh(c.vehicleId);c.type=v.type;c.brand=v.make;if($('#reviewpayment').value)c.payment=Number($('#reviewpayment').value);if($('#reviewtrade').value)c.tradeValue=Number($('#reviewtrade').value);if($('#reviewdate').value)c.followUp=$('#reviewdate').value;if(c.stage==='Sold')c.followUp=null;db.interactions.push({id:'i'+Date.now(),customerId:c.id,vehicleId:c.vehicleId,date:TODAY,kind:'Sales note',owner:c.owner,reason:$('#reviewreason').value,note:raw});let durable=persist();pending=null;recordDraft='';render();toast(c.name+' 的沟通记录已保存'+(durable?'，仅保存在当前浏览器。':'，仅本次会话有效。'));}
function openCustomer(id){const c=cust(id);if(!c)return;const v=veh(c.vehicleId),history=db.interactions.filter(i=>i.customerId===c.id).sort((a,b)=>b.date.localeCompare(a.date));$('#detailbody').innerHTML='<div class="dialogtitle"><div><h2>'+esc(c.name)+'</h2><p class="sub">'+esc(c.owner)+' · '+esc(label(c.source))+'</p></div><button class="dialogclose" id="closedetail" aria-label="关闭客户详情">×</button></div>'+badge(c.stage)+'<div class="detailstats"><div><small>预算</small><strong>'+money(c.budget)+'</strong></div><div><small>月供目标</small><strong>'+money(c.payment)+'</strong></div><div><small>下次跟进</small><strong>'+(c.followUp?dateLabel(c.followUp):'无')+'</strong></div></div><dl class="kv"><dt>联系方式</dt><dd>'+esc(c.email)+'<br>'+esc(c.phone)+'</dd><dt>意向车辆</dt><dd>'+esc(carname(v))+' · '+money(v.price)+'</dd><dt>购车偏好</dt><dd>'+esc(label(c.type))+' · '+esc(c.brand)+' · '+esc(label(c.color))+'</dd><dt>旧车置换</dt><dd>'+esc(label(c.tradeIn))+(c.tradeValue!==null?' · '+money(c.tradeValue)+' 估值':'')+'</dd></dl><h3 style="margin-top:24px">最近的沟通内容</h3><p>'+esc(noteText(c.notes))+'</p><div class="recordactions"><button class="primary" data-recordcustomer="'+c.id+'">添加沟通记录</button><button class="outline" data-customerask="'+c.id+'">询问 Memora</button><button class="outline" data-follow="'+c.id+'">设为明天跟进</button></div><h3 style="margin-top:28px">沟通历史 · '+history.length+'</h3><div class="timeline">'+history.map(i=>'<div class="timelineitem"><small>'+dateLabel(i.date)+' · '+esc(label(i.kind))+' · '+esc(i.owner)+'</small><p>'+esc(noteText(i.note))+'</p><span class="pill">'+esc(label(i.reason))+'</span></div>').join('')+'</div>';if(!$('#detail').open)$('#detail').showModal()}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-customer]');if(!b)return;if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.query){ask(b.dataset.query);return}if(b.dataset.customer){openCustomer(b.dataset.customer);return}if(b.dataset.match){ask(carname(veh(b.dataset.match))+' 有哪些潜在客户？');return}if(b.dataset.recordcustomer){selectedCustomer=b.dataset.recordcustomer;pending=null;recordDraft='';$('#detail').close();navigate('record');return}if(b.dataset.customerask){$('#detail').close();ask(cust(b.dataset.customerask).name+' 的情况怎么样？');return}if(b.dataset.follow){let c=cust(b.dataset.follow);if(c.stage==='Sold'){toast('这位客户已成交。');return}c.followUp=day(1);persist();render();openCustomer(c.id);toast('跟进已安排在 '+dateLabel(day(1)));return}if(b.id==='closedetail')$('#detail').close();if(b.id==='clearchat'){if(chatBusy)return;chat=[];render()}if(b.id==='example'){recordDraft=example;$('#recordtext').value=example;}if(b.id==='savememory')saveMemory();if(b.id==='voice')voice();if(b.id==='reset'){$('#detailbody').innerHTML='<div class="dialogtitle"><h2>重置演示数据？</h2><button class="dialogclose" id="closedetail" aria-label="关闭">×</button></div><p>这会删除当前浏览器中保存的修改，恢复初始演示数据。</p><button class="primary" id="confirmreset">重置演示数据</button>';$('#detail').showModal()}if(b.id==='confirmreset'){if(chatBusy||extractBusy){toast('请等 AI 请求完成后再重置。');return}db=seed();persist();pending=null;recordDraft='';chat=[];$('#detail').close();navigate('overview');toast('演示数据已重置。')}});
document.addEventListener('submit',e=>{if(e.target.id==='askform'){e.preventDefault();ask($('#question').value)}if(e.target.id==='recordform'){e.preventDefault();let raw=$('#recordtext').value.trim();if(!raw){toast('请先输入沟通内容。');return}captureMemory(raw,$('#recordcustomer').value)}});
document.addEventListener('input',e=>{if(e.target.id==='recordtext')recordDraft=e.target.value;if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.id==='recordcustomer'){selectedCustomer=e.target.value;pending=null;$('.extraction')?.remove()}});
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('此浏览器无法使用语音输入，请输入或粘贴记录。');return}const rec=new SR();rec.lang='zh-CN';rec.interimResults=false;rec.onresult=e=>{if($('#recordtext'))$('#recordtext').value+=e.results[0][0].transcript};rec.onerror=()=>toast('未能录入语音，请检查麦克风权限，或改用文字输入。');rec.onend=()=>{if($('#voice'))$('#voice').textContent='语音输入'};try{rec.start();$('#voice').textContent='正在聆听…'}catch{toast('麦克风未能启动，请改用文字输入。')}}
if(document.modelContext?.registerTool){const lifecycle=new AbortController();for(const tool of [{name:'query_dealership_memory',description:'Read fictional dealership records using the same demo assistant as the interface. Opens the assistant and displays the answer.',inputSchema:{type:'object',properties:{question:{type:'string'}},required:['question'],additionalProperties:false},annotations:{readOnlyHint:true},async execute(input){if(!input||typeof input.question!=='string'||!input.question.trim())throw new Error('question must be a nonempty string');if(chatBusy)throw new Error('Assistant is busy');await ask(input.question);return {question:input.question,answer:chat.at(-1).html.replace(/<[^>]*>/g,' ')}}},{name:'open_customer_memory',description:'Open an existing customer detail panel without modifying records.',inputSchema:{type:'object',properties:{customerId:{type:'string'}},required:['customerId'],additionalProperties:false},annotations:{readOnlyHint:true},execute(input){if(!input||typeof input.customerId!=='string'||!cust(input.customerId))throw new Error('Unknown customer');openCustomer(input.customerId);return {customerId:input.customerId,name:cust(input.customerId).name}}}]){try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{})}catch{}}window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true})}
render();checkAI();
</script></body></html>
